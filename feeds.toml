# MSM8998 support is local and unpublished. Never invent a remote commit to
# make a status report appear pinned: when a public UniXNU-msm8998-common
# exists, replace `local` with `git` and its reviewed 40-character commit.

[[source]]
name = "msm8998"
kind = "soc"
local = "soc/msm8998"
