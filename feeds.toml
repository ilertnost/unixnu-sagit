# Device source pins. The base feeds.toml of the UniXNU checkout supplies the
# refer sources (xnu, libplatform, libdispatch, AvailabilityVersions, edk2,
# libpthread, corecrypto-2023, IOStorageFamily); this file only adds what the
# device itself needs.
