# Xiaomi Mi 6 (sagit), MSM8998 / Snapdragon 835.
#
# Format 1 device profile for the UniXNU build driver. Only the pieces that a
# RAM-rooted bring-up needs are declared; there is no storage, APFS or Apple
# userspace in this stage.

[board]
name = "sagit"
soc = "MSM8998"
description = "Xiaomi Mi 6 (sagit), Snapdragon 835, 4 or 6 GB"
kit = "sagit"

[kernel]
defconfig = "sagit_defconfig"
# Built after the compile records exist, in this order. Source crypto, pthread
# and the mock filesystem are what make a storage-less kernel linkable; the
# namespaced corecrypto pass must follow the plain one.
archives = [
  "build-libpthread-kernel.py",
  "build-corecrypto-14.py",
  "build-corecrypto-14.py --namespace",
  # ARM_DT_PLATFORM and ARMCPU are drivers, and in a format-1 profile a driver
  # is not built from its component entry: the link then fails on a missing
  # libArmDTPlatform.a. build-arm-driver.py is the builder the format-2
  # catalog names, used here directly.
  "build-arm-driver.py ArmDTPlatform",
  "build-arm-driver.py ArmCpu",
  "build-arm-driver.py RamBlock",
  "build-mockfs-fixture.py",
]

[bootimg.image]
header_version = 1
pagesize = 2048
# Standard msm8998 layout: kernel 0x10008000, ramdisk 0x11000000, tags 0x10000100.
base = 0x10000000
kernel_offset = 0x8000
ramdisk_offset = 0x1000000
tags_offset = 0x100

# Values measured or carried over from the SoC, not from a working boot yet.
[bringup]
stage = "compile-and-inspect"
hardware_boot_qualified = false
cpu_count = 1
kernel_page_bytes = 4096
timer_frequency = 19200000
virtual_timer_intid = 19
gicd = 0x17a00000
gicd_size = 0x10000
gicr = 0x17b00000
gicr_size = 0x100000
redistributor_stride = 0x20000
arm_io_base = 0x1000000
arm_io_size = 0xff000000
