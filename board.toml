# Xiaomi Mi 6 (sagit), MSM8998 / Snapdragon 835.
#
# Format 2 device profile. Only the pieces that a RAM-rooted bring-up needs
# are declared; there is no storage, APFS or Apple userspace in this stage.
# The migrated format-1 profile is preserved under old/.

schema_version = 2

[board]
name = "sagit"
soc = "MSM8998"
soc_source = "msm8998"
os_profile = "ios-16.7.16-20H392"
description = "Xiaomi Mi 6 (sagit), Snapdragon 835, 4 or 6 GB"
kit = "sagit"

[components]
include = ["ArmDTPlatform", "ArmCpu", "XnuPrelink", "DarwinBoot", "RamBlock"]

[kernel]
defconfig = "sagit_defconfig"
config_fragments = [
  "arch:configs/common.config",
  "soc:configs/msm8998.config",
  "os:configs/ios.config",
]
patch_series = [
  "os:patches/xnu/series-arch",
  "soc:patches/xnu/series",
  "os:patches/xnu/series",
  "device:patches/xnu/series",
]
# Built after the compile records exist, in this order. Source crypto, pthread
# and the mock filesystem are what make a storage-less kernel linkable; the
# namespaced corecrypto pass must follow the plain one. Arrays replace the
# inherited arrays, so the full ordered plan is listed here; component: entries
# are the catalog recipes that build-arm-driver.py wraps.
archives = [
  "build-libpthread-kernel.py",
  "build-corecrypto-14.py",
  "build-corecrypto-14.py --namespace",
  "component:ArmDTPlatform",
  "component:ArmCpu",
  "component:RamBlock",
  "build-mockfs-fixture.py",
]

[device_tree]
source = "device:dts/sagit.dts"
include_dirs = ["soc:dts"]

[bootimg.image]
header_version = 1
pagesize = 2048
# Standard msm8998 layout: kernel 0x10008000, ramdisk 0x11000000, tags 0x10000100.
base = 0x10000000
kernel_offset = 0x8000
ramdisk_offset = 0x1000000
tags_offset = 0x100

# The payload the firmware reads from the FAT volume. The ADT itself is still
# generated by tools/make-sagit-adt.py (identity half mirrored from the D20AP
# tree, see docs/ADT-SAGIT.md); these tables document the values it uses and
# become authoritative once the common ADT generator replaces the tool.
[payload]
volume = "ADRENOLINE"
size_mib = 24
loader = "firmware"
title = "Adrenoline"
dram_size = "0xf0000000"
panic_screen = false
timeout = 3
kernel_args = ["-v", "-enable_kprintf_spam", "debug=0x14e"]

[payload.adt]
chip_id = "0x8015"
unique_chip_id = "required"
owned_memory_size = "0x10000000"
packed_data_ramdisk = false

# Values measured or carried over from the SoC, not from a working boot yet.
# Recorded here for the porting record; the resolver ignores unknown tables.
[bringup]
stage = "compile-and-inspect"
hardware_boot_qualified = false
cpu_count = 1
kernel_page_bytes = 4096
timer_frequency = 19200000
virtual_timer_intid = 19
gicd = 0x17a00000
gicd_size = 0x10000
gicr = 0x17b00000
gicr_size = 0x100000
redistributor_stride = 0x20000
arm_io_base = 0x1000000
arm_io_size = 0xff000000
