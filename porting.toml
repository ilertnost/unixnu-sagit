[[area]]
id = "gpu"
status = "planned"
components = []
paths = ["docs/ADR-0003-boot-chain.md"]
inputs = ["Adreno 540 (a5xx family) in the Mi 6."]
configuration = ["Per ADR-0003 the GPU stack (IOKit driver, firmware loading, ring submission, Metal frontend, NIR, PM4/Gallium backends) lives only in the Adrenoline repository; unixnu-sagit consumes the resulting kexts and keeps only a basic software framebuffer renderer for diagnostics."]
procedure = ["Adrenoline develops the driver; this repository tracks the boundary and consumes kexts."]
findings = ["The boundary decision was made to keep diagnostics working when the GPU path is broken: the ladder needs nothing but the framebuffer."]
completion = ["Adrenoline kexts load in the XNU runtime on this board."]
limits = ["No GPU code lives in this repository by design."]
next_action = ["Keep the repository boundary; revisit when Adrenoline reaches a6xx-compatible bring-up readiness for a5xx."]
