[[area]]
id = "diagnostics"
status = "implemented"
components = []
paths = ["patches/0006-sagit-boot-ladder.patch", "docs/XNU-SAGIT.md", "tools/startup-entries.py"]
inputs = ["The framebuffer is the only diagnostics channel that survives early faults; serial exists only on Apple hardware."]
configuration = ["The boot ladder paints bars, a decimal checkpoint counter, phase markers 91-99 and sub-ladder rows into the framebuffer from _start_first_cpu through the startup hooks; tools/startup-entries.py lists the kernel startup hook table in execution order."]
procedure = ["Boot, photograph the screen, read the counter and squares against the table in docs/XNU-SAGIT.md."]
findings = ["Numbers 91-99 are reserved for phase markers so they cannot be mistaken for checkpoints; the startup-hook loop erases its sub-ladder row every iteration so the last frame shows only the fatal entry."]
completion = ["Every bring-up stage has a visible checkpoint and a documented reading."]
limits = ["No serial or USB log channel on this board yet (ADR-0006 records the USB-log plan)."]
next_action = ["Bisect the STARTUP_SUB_KPRINTF batch with the startup-hook sub-ladder."]
evidence = [
  { kind = "source", reference = "docs/XNU-SAGIT.md", result = "Ladder semantics, checkpoint table and reading instructions" },
]
