procedure = ["The ladder uses the raw framebuffer as its diagnostics canvas."]
findings = ["The boot menu redraws the framebuffer between boots and covers the middle of the ladder column, which is why the counter was added to the corners."]
completion = ["A display driver drives the panel through the native graphics stack."]
limits = ["Panel, backlight and display pipeline are untouched."]
