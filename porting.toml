status = "implemented"
components = []
paths = ["tools/mksagit-payload.py", "tools/build-sagit-edk2.sh", "tools/build-xnu-sagit.sh", "scripts/package.sh", "board.toml"]
inputs = ["Android boot image v1, pagesize 2048, base 0x10000000; payload FAT volume ADRENOLINE, 24 MiB, pinned timestamps."]
configuration = ["The packaging flow is the device's own scripts (kernel -> payload volume -> firmware -> boot image); the official ./unixnu payload/bootimg steps take over when the firmware moves to Mu-Silicium."]
procedure = ["tools/build-xnu-sagit.sh builds the kernel; tools/mksagit-payload.py packs the payload; tools/build-sagit-edk2.sh builds the firmware and packages boot-sagit.img."]
findings = ["The payload layout is fixed: /EFI/UniXNU/{unixnu.toml, Payloads/kernel.macho, Payloads/kernel.macho.adt}; two runs with the same arguments produce identical bytes except the ADT random seed."]
completion = ["The same two artifacts build from a clean checkout with no edits."]
